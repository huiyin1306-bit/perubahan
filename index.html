<script>
    // Audio synthesizer helper class to avoid external audio loading issues
    class SoundEffects {
        constructor() {
            this.ctx = null;
        }
        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        playClick() {
            this.init();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            
            osc.frequency.setValueAtTime(400, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        }
        playCorrect() {
            this.init();
            const now = this.ctx.currentTime;
            const playNote = (freq, start, duration) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.frequency.setValueAtTime(freq, start);
                gain.gain.setValueAtTime(0.15, start);
                gain.gain.exponentialRampToValueAtTime(0.01, start + duration);
                osc.start(start);
                osc.stop(start + duration);
            };
            playNote(523.25, now, 0.15); // C5
            playNote(659.25, now + 0.1, 0.25); // E5
        }
        playIncorrect() {
            this.init();
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.3);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start();
            osc.stop(now + 0.3);
        }
        playVictory() {
            this.init();
            const now = this.ctx.currentTime;
            const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50]; // Arpeggio C Major
            notes.forEach((freq, i) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.frequency.setValueAtTime(freq, now + (i * 0.1));
                gain.gain.setValueAtTime(0.1, now + (i * 0.1));
                gain.gain.exponentialRampToValueAtTime(0.01, now + (i * 0.1) + 0.3);
                osc.start(now + (i * 0.1));
                osc.stop(now + (i * 0.1) + 0.3);
            });
        }
    }
    const sound = new SoundEffects();
</script>

<script>
    // System Variables
    let currentScore = 0;
    let currentStage = 'splash'; // splash, intro_1, intro_2, level_1, level_2, completion
    const snowContainer = document.getElementById('snow-container');

    // Create background snowflakes
    function createSnow() {
        snowContainer.innerHTML = '';
        for (let i = 0; i < 25; i++) {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snow-particle');
            snowflake.style.left = `${Math.random() * 100}%`;
            snowflake.style.width = `${Math.random() * 6 + 3}px`;
            snowflake.style.height = snowflake.style.width;
            snowflake.style.animationDuration = `${Math.random() * 5 + 5}s`;
            snowflake.style.animationDelay = `${Math.random() * 5}s`;
            snowContainer.appendChild(snowflake);
        }
    }
    createSnow();

    function updateScore(points) {
        currentScore += points;
        document.getElementById('score-val').innerText = currentScore;
    }

    // Modal Controller
    function showModal(title, text, type = 'success') {
        const modal = document.getElementById('info-modal');
        const mTitle = document.getElementById('modal-title');
        const mText = document.getElementById('modal-text');
        const mIcon = document.getElementById('modal-icon');
        const mBox = document.getElementById('modal-content');

        mTitle.innerText = title;
        mText.innerHTML = text;

        if (type === 'success') {
            sound.playCorrect();
            mBox.className = "bg-white rounded-3xl max-w-md w-full p-6 border-4 border-emerald-400 shadow-2xl transform transition-all";
            mIcon.innerHTML = `
                <div class="w-12 h-12 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-500">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                </div>`;
        } else if (type === 'info') {
            sound.playClick();
            mBox.className = "bg-white rounded-3xl max-w-md w-full p-6 border-4 border-cyan-400 shadow-2xl transform transition-all";
            mIcon.innerHTML = `
                <div class="w-12 h-12 bg-cyan-100 rounded-full flex items-center justify-center text-cyan-500">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>`;
        } else {
            sound.playIncorrect();
            mBox.className = "bg-white rounded-3xl max-w-md w-full p-6 border-4 border-rose-400 shadow-2xl transform transition-all";
            mIcon.innerHTML = `
                <div class="w-12 h-12 bg-rose-100 rounded-full flex items-center justify-center text-rose-500">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                </div>`;
        }

        modal.classList.remove('hidden');
    }

    function closeModal() {
        sound.playClick();
        document.getElementById('info-modal').classList.add('hidden');
    }
</script>

    function populateLevel1Animals() {
        const container = document.getElementById('animals-container');

        shuffledList.forEach(animal => {
            container.innerHTML += `
                <div id="animal-${animal.id}" onclick="selectAnimal('${animal.id}')" class="bg-white border-2 border-slate-200 hover:border-cyan-400 p-2 rounded-xl flex items-center justify-between cursor-pointer transition-all shadow-sm">

                    </div>
                </div>
            `;
        });
    }

    function selectAnimal(id) {
        sound.playClick();
        if (selectedAnimal) {
            const prevElement = document.getElementById(`animal-${selectedAnimal.id}`);
            if (prevElement) prevElement.classList.replace('border-cyan-400', 'border-slate-200');
        }

        selectedAnimal = level1Data.find(a => a.id === id);
        const currentElement = document.getElementById(`animal-${id}`);
        if (currentElement) {
            currentElement.classList.replace('border-slate-200', 'border-cyan-400');
        }
    }

    function handleZoneClick(type) {
        if (!selectedAnimal) {
            showModal('Pilih Haiwan Dahulu!', 'Sila klik pada salah satu kad haiwan di sebelah kiri terlebih dahulu.', 'warning');
            return;
        }

        const animalEl = document.getElementById(`animal-${selectedAnimal.id}`);
        const checkboxEl = document.getElementById(`checkbox-${selectedAnimal.id}`);

        if (selectedAnimal.type === type) {
            sound.playCorrect();
            updateScore(10);
            
            const targetMatchedZone = document.getElementById(`matched-${type.toLowerCase()}`);
            targetMatchedZone.innerHTML += `
                <span class="bg-white px-1.5 py-0.5 rounded border border-emerald-400 text-[10px] font-bold animate-bounce flex items-center gap-1 shadow-sm">
                    ${selectedAnimal.emoji} ${selectedAnimal.name}
                </span>`;
            
            animalEl.classList.add('opacity-40', 'pointer-events-none', 'bg-slate-50');
            checkboxEl.innerHTML = `
                <svg class="w-3 h-3 text-emerald-500" fill="currentColor" viewBox="0 0 20 20">

                </svg>`;
            checkboxEl.classList.replace('border-slate-300', 'border-emerald-500');

            const praiseWords = ["Syabas! Hebat sekali!", "Tahniah! Anda Bijak!", "Tepat sekali!", "Wow! Bagus sekali!"];
            const randomPraise = praiseWords[Math.floor(Math.random() * praiseWords.length)];
            
            showModal(randomPraise, `Betul, <strong>${selectedAnimal.name}</strong> ialah haiwan <strong>${type}</strong> kerana ia makan <strong>${selectedAnimal.foods}</strong>!`, 'success');
            
            answeredCount++;
            selectedAnimal = null;

            if (answeredCount === level1Data.length) {
                document.getElementById('next-stage-btn').disabled = false;
                document.getElementById('next-stage-btn').className = "flex-1 py-2 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-extrabold rounded-xl text-xs cursor-pointer transition-all border-b-4 border-emerald-700 active:border-b-0 active:translate-y-1 shadow-sm";
                sound.playVictory();
                showModal('Tahniah! Tahap 1 Selesai!', 'Sila klik butang "Seterusnya" untuk melangkah ke Cabaran Beruang Kutub!', 'success');
            }
        } else {
            sound.playIncorrect();

        }
    }
</script>

    function feedBear(bearType, foodType) {
        if (bearType === 'forest') {
            if (forestBearFed >= forestBearNeeds) {
                showModal('Dah Kenyang!', 'Beruang Perang di hutan ini sudah kenyang dan gembira! 🐻', 'info');
                return;
            }

            if (foodType === 'berry' || foodType === 'honey' || foodType === 'fish') {
                sound.playCorrect();
                forestBearFed++;
                updateScore(15);
                
                const percentage = (forestBearFed / forestBearNeeds) * 100;
                document.getElementById('forest-bear-progress').style.width = `${percentage}%`;
                document.getElementById('forest-bear-txt').innerText = `${forestBearFed}/${forestBearNeeds} Diisi`;

                let foodLabel = foodType === 'berry' ? 'Buah Beri 🍓' : (foodType === 'honey' ? 'Madu 🍯' : 'Ikan 🐟');
                showModal('Yum Yum! Sedapnya! 😋', `Betul! Beruang Perang makan <strong>${foodLabel}</strong> kerana ia adalah haiwan <strong>OMNIVOR</strong>.`, 'success');
            }
        } else if (bearType === 'polar') {
            if (polarBearFed >= polarBearNeeds) {
                showModal('Dah Kenyang!', 'Beruang Kutub ini sudah kenyang dan bertenaga! 🐻‍❄️', 'info');
                return;
            }

            if (foodType === 'seal' || foodType === 'fish') {
                sound.playCorrect();
                polarBearFed++;
                updateScore(15);

                const percentage = (polarBearFed / polarBearNeeds) * 100;
                document.getElementById('polar-bear-progress').style.width = `${percentage}%`;
                document.getElementById('polar-bear-txt').innerText = `${polarBearFed}/${polarBearNeeds} Diisi`;

                let foodLabel = foodType === 'seal' ? 'Anjing Laut 🦭' : 'Ikan 🐟';
                showModal('Berjaya Memberi Makan! 🧊', `Betul! Beruang Kutub makan <strong>${foodLabel}</strong>. Ia merupakan haiwan <strong>KARNIVOR</strong>!`, 'success');
            } else if (foodType === 'berry') {
                sound.playIncorrect();
                showModal('Tiada Tumbuhan! 🥶', `Alamak! Di Kutub Utara yang membeku, <strong>tumbuhan tidak boleh hidup</strong>! Jadi tiada <strong>Buah Beri 🍓</strong> di sana. Beruang Kutub terpaksa menjadi Karnivor demi kelangsungan hidup!`, 'error');
            }
        }

        if (forestBearFed === forestBearNeeds && polarBearFed === polarBearNeeds) {
            document.getElementById('end-game-btn').disabled = false;
            document.getElementById('end-game-btn').className = "flex-1 py-2 bg-gradient-to-r from-indigo-500 to-blue-600 hover:from-indigo-600 hover:to-blue-700 text-white font-extrabold rounded-xl text-xs cursor-pointer transition-all border-b-4 border-indigo-800 active:border-b-0 active:translate-y-1 shadow-sm";
            sound.playVictory();
            showModal('Hebat! Kedua-dua Beruang Kenyang!', 'Anda adalah Pakar Sains Cilik! Sekarang anda faham kenapa Beruang Kutub tidak boleh makan tumbuhan.', 'success');
        }
    }
</script>

                    </h4>

                    <div class="space-y-1 mb-3 text-xs">
                        <p class="text-[11px] text-slate-700 leading-tight">
                            <strong>Beruang Kutub</strong> terpaksa menjadi <strong>Karnivor</strong> kerana iklim kutub yang terlalu sejuk menyebabkan tumbuh-tumbuhan tidak boleh tumbuh.
                        </p>
                        <div class="bg-amber-200/50 p-1 px-2.5 rounded-full text-[10px] font-bold text-amber-950 inline-block">
                            Gred: ${rankBadge}
                        </div>
                    </div>

                    <div class="flex items-center justify-between border-t border-dashed border-amber-300 pt-2 text-left">
                        <div>
                            <span class="block text-[8px] text-slate-400 uppercase font-bold">Markah Terkumpul</span>
                            <span class="text-base font-black text-amber-600">${currentScore} Mata ⭐</span>
                        </div>
                        <div class="text-right">
                            <span class="block text-[8px] text-slate-400 uppercase font-bold">Kategori</span>
                            <span class="text-[11px] font-extrabold text-slate-700">Sains Tahun 3</span>
                        </div>
                    </div>
                </div>

                <!-- Interactive restart panel -->
                <div class="flex gap-3 w-full max-w-xs justify-center">
                    <button onclick="sound.playClick(); resetGame();" class="flex-1 py-3 bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-600 hover:to-blue-600 text-white font-extrabold text-sm rounded-xl transition-all border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 shadow-sm">
                        🔄 Main Semula
                    </button>
                </div>

            </div>
        `;
    }
</script>

<script>
    function resetGame() {
        sound.playClick();
        currentScore = 0;
        document.getElementById('score-val').innerText = '0';
        renderSplash();
    }

    // Auto load splash screen on load
    window.onload = function() {
        renderSplash();
    };
</script>

</body>
</html>
